# Docker Compose file for NimbusSite
# Compatible with Docker Compose v2.0+
# Works on Windows, Linux, and macOS

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: nimbussite-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sqlPassword123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-NimbusSite_Tenants}
      SEED_DATA: ${SEED_DATA:-false}
    ports:
      - "${MYSQL_PORT_EXTERNAL:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - ./scripts/seed-data.sql:/docker-entrypoint-initdb.d/seed-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-sqlPassword123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - nimbussite-network

  # Kafka (KRaft mode, без ZooKeeper)
  kafka:
    image: apache/kafka:latest
    container_name: nimbussite-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "abcdefghijklmnopqrstuv"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - nimbussite-network

  # Kafka Topics Initializer
  kafka-topics-init:
    image: apache/kafka:latest
    container_name: nimbussite-kafka-topics-init
    volumes:
      - ./scripts/create-kafka-topics.sh:/create-kafka-topics.sh:ro
    entrypoint: ["/bin/bash", "-c"]
    command: 
      - "sed -i 's/\\r$$//' /create-kafka-topics.sh 2>/dev/null || true; chmod +x /create-kafka-topics.sh; /create-kafka-topics.sh && tail -f /dev/null"
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list 2>/dev/null | grep -q 'domain-events-accesspermissions'"]
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 180s
    networks:
      - nimbussite-network
    restart: "no"

  # Tenants API
  tenants-api:
    build:
      context: .
      dockerfile: src/Modules/Tenants/dockerfile
    container_name: nimbussite-tenants-api
    ports:
      - "${TENANTS_API_PORT:-5001}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-domain-events}
      TENANTS_DB_CONNECTION_STRING: ${TENANTS_DB_CONNECTION_STRING:-Server=mysql;Port=3306;Database=NimbusSite_Tenants;User=root;Password=sqlPassword123;CharSet=utf8mb4;}
      ConnectionStrings__DefaultConnection: ${TENANTS_DB_CONNECTION_STRING:-Server=mysql;Port=3306;Database=NimbusSite_Tenants;User=root;Password=sqlPassword123;CharSet=utf8mb4;}
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s
    networks:
      - nimbussite-network

  # Users API
  users-api:
    build:
      context: .
      dockerfile: src/Modules/Users/dockerfile
    container_name: nimbussite-users-api
    ports:
      - "${USERS_API_PORT:-5002}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-domain-events}
      # Connection string определяется динамически через ShardMap на основе TenantId
      # TENANTS_DB_CONNECTION_STRING нужна для доступа к центральной БД (ShardMap)
      TENANTS_DB_CONNECTION_STRING: ${TENANTS_DB_CONNECTION_STRING:-Server=mysql;Port=3306;Database=NimbusSite_Tenants;User=root;Password=sqlPassword123;CharSet=utf8mb4;}
      USERS_DB_CONNECTION_STRING: ${USERS_DB_CONNECTION_STRING:-}
    depends_on:
      mysql:
        condition: service_healthy
      tenants-api:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s
    networks:
      - nimbussite-network

  # Projects API
  projects-api:
    build:
      context: .
      dockerfile: src/Modules/Projects/dockerfile
    container_name: nimbussite-projects-api
    ports:
      - "${PROJECTS_API_PORT:-5003}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-domain-events}
      # Connection string определяется динамически через ShardMap на основе TenantId
      # TENANTS_DB_CONNECTION_STRING нужна для доступа к центральной БД (ShardMap)
      TENANTS_DB_CONNECTION_STRING: ${TENANTS_DB_CONNECTION_STRING:-Server=mysql;Port=3306;Database=NimbusSite_Tenants;User=root;Password=sqlPassword123;CharSet=utf8mb4;}
      PROJECTS_DB_CONNECTION_STRING: ${PROJECTS_DB_CONNECTION_STRING:-}
    depends_on:
      mysql:
        condition: service_healthy
      tenants-api:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s
    networks:
      - nimbussite-network

  # Tasks API
  tasks-api:
    build:
      context: .
      dockerfile: src/Modules/Tasks/dockerfile
    container_name: nimbussite-tasks-api
    ports:
      - "${TASKS_API_PORT:-5004}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-domain-events}
      # Connection string определяется динамически через ShardMap на основе TenantId
      # TENANTS_DB_CONNECTION_STRING нужна для доступа к центральной БД (ShardMap)
      TENANTS_DB_CONNECTION_STRING: ${TENANTS_DB_CONNECTION_STRING:-Server=mysql;Port=3306;Database=NimbusSite_Tenants;User=root;Password=sqlPassword123;CharSet=utf8mb4;}
      TASKS_DB_CONNECTION_STRING: ${TASKS_DB_CONNECTION_STRING:-}
    depends_on:
      mysql:
        condition: service_healthy
      tenants-api:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s
    networks:
      - nimbussite-network

  # Identity API
  identity-api:
    build:
      context: .
      dockerfile: src/Modules/Identity/dockerfile
    container_name: nimbussite-identity-api
    ports:
      - "${IDENTITY_API_PORT:-5005}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-domain-events}
      # Connection string определяется динамически через ShardMap на основе TenantId
      # TENANTS_DB_CONNECTION_STRING нужна для доступа к центральной БД (ShardMap)
      # IDENTITY_DB_CONNECTION_STRING используется только для автоматического применения миграций при старте (опционально)
      TENANTS_DB_CONNECTION_STRING: ${TENANTS_DB_CONNECTION_STRING:-Server=mysql;Port=3306;Database=NimbusSite_Tenants;User=root;Password=sqlPassword123;CharSet=utf8mb4;}
      IDENTITY_DB_CONNECTION_STRING: ${IDENTITY_DB_CONNECTION_STRING:-}
      ConnectionStrings__DefaultConnection: ${IDENTITY_DB_CONNECTION_STRING:-}
      JWT__SECRETKEY: ${JWT_SECRET_KEY:-your-secret-key-here-change-in-production}
      JWT__ISSUER: ${JWT_ISSUER:-NimbusSite}
      JWT__AUDIENCE: ${JWT_AUDIENCE:-NimbusSite-Users}
      JWT__AccessTokenExpirationMinutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-60}
      JWT__RefreshTokenExpirationDays: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-30}
    depends_on:
      mysql:
        condition: service_healthy
      tenants-api:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s
    networks:
      - nimbussite-network

  # AccessPermissions API
  accesspermissions-api:
    build:
      context: .
      dockerfile: src/Modules/AccessPermissions/dockerfile
    container_name: nimbussite-accesspermissions-api
    ports:
      - "${ACCESSPERMISSIONS_API_PORT:-5006}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-domain-events}
      # Connection string определяется динамически через ShardMap на основе TenantId
      # TENANTS_DB_CONNECTION_STRING нужна для доступа к центральной БД (ShardMap)
      TENANTS_DB_CONNECTION_STRING: ${TENANTS_DB_CONNECTION_STRING:-Server=mysql;Port=3306;Database=NimbusSite_Tenants;User=root;Password=sqlPassword123;CharSet=utf8mb4;}
      ACCESSPERMISSIONS_DB_CONNECTION_STRING: ${ACCESSPERMISSIONS_DB_CONNECTION_STRING:-}
    depends_on:
      mysql:
        condition: service_healthy
      tenants-api:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s
    networks:
      - nimbussite-network

volumes:
  mysql_data:
  kafka_data:

networks:
  nimbussite-network:
    driver: bridge