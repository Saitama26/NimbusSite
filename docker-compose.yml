services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: nimbussite-mysql
    environment:
      MYSQL_ROOT_PASSWORD: sqlPassword123
      MYSQL_DATABASE: NimbusSite_Users
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psqlPassword123"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - nimbussite-network

  # Kafka (KRaft mode, без ZooKeeper)
  kafka:
    image: apache/kafka:latest
    container_name: nimbussite-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "abcdefghijklmnopqrstuv"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - nimbussite-network

  # Kafka Topics Initializer
  kafka-topics-init:
    image: apache/kafka:latest
    container_name: nimbussite-kafka-topics-init
    volumes:
      - ./scripts/create-kafka-topics.sh:/create-kafka-topics.sh
    entrypoint: ["/bin/bash", "-c"]
    command: ["/create-kafka-topics.sh && tail -f /dev/null"]
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list 2>/dev/null | grep -q 'domain-events-users'"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 50s
    networks:
      - nimbussite-network
    restart: "no"

  # Tenants API
  tenants-api:
    build:
      context: .
      dockerfile: src/Modules/Tenants/dockerfile
    container_name: nimbussite-tenants-api
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PREFIX: domain-events
      TENANTS_DB_CONNECTION_STRING: Server=mysql;Port=3306;Database=NimbusSite_Tenants;User=root;Password=sqlPassword123;CharSet=utf8mb4;
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=NimbusSite_Tenants;User=root;Password=sqlPassword123;CharSet=utf8mb4;
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_healthy
    networks:
      - nimbussite-network

  # Users API
  users-api:
    build:
      context: .
      dockerfile: src/Modules/Users/dockerfile
    container_name: nimbussite-users-api
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PREFIX: domain-events
      USERS_DB_CONNECTION_STRING: Server=mysql;Port=3306;Database=NimbusSite_Users;User=root;Password=sqlPassword123;CharSet=utf8mb4;
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=NimbusSite_Users;User=root;Password=sqlPassword123;CharSet=utf8mb4;
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_healthy
    networks:
      - nimbussite-network

  # Projects API
  projects-api:
    build:
      context: .
      dockerfile: src/Modules/Projects/dockerfile
    container_name: nimbussite-projects-api
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PREFIX: domain-events
      PROJECTS_DB_CONNECTION_STRING: Server=mysql;Port=3306;Database=NimbusSite_Projects;User=root;Password=sqlPassword123;CharSet=utf8mb4;
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=NimbusSite_Projects;User=root;Password=sqlPassword123;CharSet=utf8mb4;
      USERS_DB_CONNECTION_STRING: Server=mysql;Port=3306;Database=NimbusSite_Users;User=root;Password=sqlPassword123;CharSet=utf8mb4;
      TENANTS_DB_CONNECTION_STRING: Server=mysql;Port=3306;Database=NimbusSite_Tenants;User=root;Password=sqlPassword123;CharSet=utf8mb4;
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_healthy
    networks:
      - nimbussite-network

  # Tasks API
  tasks-api:
    build:
      context: .
      dockerfile: src/Modules/Tasks/dockerfile
    container_name: nimbussite-tasks-api
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PREFIX: domain-events
      TASKS_DB_CONNECTION_STRING: Server=mysql;Port=3306;Database=NimbusSite_Tasks;User=root;Password=sqlPassword123;CharSet=utf8mb4;
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=NimbusSite_Tasks;User=root;Password=sqlPassword123;CharSet=utf8mb4;
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_healthy
    networks:
      - nimbussite-network

  # Identity API
  identity-api:
    build:
      context: .
      dockerfile: src/Modules/Identity/dockerfile
    container_name: nimbussite-identity-api
    ports:
      - "5005:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PREFIX: domain-events
      IDENTITY_DB_CONNECTION_STRING: Server=mysql;Port=3306;Database=NimbusSite_Identity;User=root;Password=sqlPassword123;CharSet=utf8mb4;
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=NimbusSite_Identity;User=root;Password=sqlPassword123;CharSet=utf8mb4;
      JWT__SECRETKEY: your-secret-key-here-change-in-production
      JWT__ISSUER: NimbusSite
      JWT__AUDIENCE: NimbusSite-Users
      USERS_DB_CONNECTION_STRING: Server=mysql;Port=3306;Database=NimbusSite_Users;User=root;Password=sqlPassword123;CharSet=utf8mb4;
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_healthy
    networks:
      - nimbussite-network

  # AccessPermissions API
  accesspermissions-api:
    build:
      context: .
      dockerfile: src/Modules/AccessPermissions/dockerfile
    container_name: nimbussite-accesspermissions-api
    ports:
      - "5006:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_PREFIX: domain-events
      ACCESSPERMISSIONS_DB_CONNECTION_STRING: Server=mysql;Port=3306;Database=NimbusSite_AccessPermissions;User=root;Password=sqlPassword123;CharSet=utf8mb4;
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=NimbusSite_AccessPermissions;User=root;Password=sqlPassword123;CharSet=utf8mb4;
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_healthy
    networks:
      - nimbussite-network

volumes:
  mysql_data:
  kafka_data:

networks:
  nimbussite-network:
    driver: bridge